name: Build macOS (AU + VST3)

on:
  push:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin-navn (tom = alle)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest  # macos-14 er faset ut av GitHub
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign and validate
        run: scripts/build.sh "${{ github.event.inputs.plugin || '--all' }}"
      - name: Build installer package
        run: scripts/make-installer.sh
      - name: Build installer app (.dmg)
        run: scripts/make-installer-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SBAudio-macOS
          path: |
            dist
            !dist/*.pkg
            !dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SBAudio-Installer
          path: dist/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: SBAudio-Installer-App
          path: dist/*.dmg
